; Firmware del brazo robotico MT8005 (Arduino UNO R4 WiFi + PCA9685)
; Antes de compilar corren scripts/gen_geometria.py y scripts/gen_interfaz.py
[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters = send_on_enter
monitor_eol = LF
extra_scripts =
    pre:scripts/gen_geometria.py
    pre:scripts/gen_interfaz.py
